<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>WATERMARK PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f1f5f9;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont;
      }

      /* ===== CONTAINER ===== */
      .tool-container {
        max-width: 1100px;
        margin: 60px auto;
        background: #fff;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      }

      h2 {
        font-weight: 700;
        text-align: center;
        margin-bottom: 28px;
      }

      /* ===== UPLOAD ===== */
      .upload-box {
        border: 2px dashed #c7d2fe;
        border-radius: 16px;
        padding: 36px 20px;
        text-align: center;
        cursor: pointer;
        color: #4f46e5;
        font-weight: 600;
        transition: 0.2s;
        margin-bottom: 28px;
      }

      .upload-box:hover {
        background: #eef2ff;
      }

      /* ===== 2 COLUMNS ===== */
      .edit-area {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 24px;
      }

      /* ===== PREVIEW ===== */
      .preview-box {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        height: 520px;
        overflow: hidden;
        background: #f8fafc;
      }

      .preview-box iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* ===== OPTIONS ===== */
      .option-box {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 20px;
        background: #f9fafb;
      }

      .option-box h5 {
        font-weight: 700;
        margin-bottom: 16px;
      }

      .form-label {
        font-weight: 600;
      }

      .btn-main {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-weight: 700;
        font-size: 1.05rem;
      }

      .btn-main:disabled {
        background: #c7d2fe;
      }

      /* ===== NAVBAR (giữ giống merge) ===== */
      .navbar {
        min-height: 70px;
      }

      .navbar .nav-link {
        font-size: 1.05rem;
        padding: 10px 18px;
        border-radius: 12px;
        color: #374151;
        transition: 0.2s;
      }

      .navbar .nav-link:hover {
        background: #f1f5f9;
        color: #2563eb;
      }

      .navbar .nav-link.active {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #fff !important;
        font-weight: 600;
      }

      .dropdown-menu {
        border-radius: 14px;
        border: none;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
      }
      .action-box {
        margin-top: 20px;
        text-align: center;
      }

      .action-box {
        margin-top: 24px;
        text-align: center;
      }

      /* BUTTON STYLE */
      .primary-btn {
        width: 100%;
        max-width: 420px;
        padding: 16px 24px;

        font-size: 18px;
        font-weight: 600;
        color: #fff;

        border: none;
        border-radius: 14px;

        background: linear-gradient(135deg, #3b82f6, #7c3aed);
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);

        cursor: pointer;
        transition: all 0.25s ease;
      }

      /* HOVER */
      .primary-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 14px 32px rgba(124, 58, 237, 0.45);
      }

      /* DISABLED */
      .primary-btn:disabled {
        background: linear-gradient(135deg, #9ca3af, #c7c7c7);
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-danger fs-4" href="/">PDF TOOLS</a>

        <ul class="navbar-nav me-auto align-items-center fw-semibold">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('merge') }}">GHÉP PDF</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('split') }}">TÁCH PDF</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">CHUYỂN ĐỔI PDF</a>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle active"
              role="button"
              data-bs-toggle="dropdown"
            >
              CHỈNH SỬA PDF
            </a>

            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item" href="{{ url_for('rotate_pdf') }}">
                  🔄 Xoay trang
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('page_number') }}">
                  🔢 Thêm số trang
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('watermark') }}">
                  💧 Thêm hình mờ
                </a>
              </li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              role="button"
              data-bs-toggle="dropdown"
            >
              TẤT CẢ CÁC CÔNG CỤ PDF
            </a>

            <ul class="dropdown-menu shadow">
              <li>
                <a class="dropdown-item" href="{{ url_for('merge') }}"
                  >GHÉP PDF</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('split') }}"
                  >TÁCH PDF</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('index') }}"
                  >CHUYỂN ĐỔI PDF</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <div class="tool-container">
      <h2>WATERMARK PDF</h2>

      <!-- 2 columns -->
      <div class="edit-area">
        <!-- PREVIEW -->
        <div class="preview-box">
          <iframe id="pdfPreview"></iframe>
        </div>

        <div class="option-box">
          <label class="upload-box">
            <input
              type="file"
              id="pdfInput"
              multiple
              accept="application/pdf"
              hidden
            />

            📄 Kéo thả hoặc bấm chọn file PDF
          </label>
          <h5>Tuỳ chọn Watermark</h5>

          <!-- PAGE RANGE -->
          <div class="mb-3">
            <label class="form-label">Trang áp dụng</label>
            <input
              type="text"
              class="form-control"
              id="pageRange"
              placeholder="VD: 1-3,5 (để trống = tất cả)"
            />
          </div>

          <!-- WATERMARK TYPE -->
          <div class="mb-3">
            <label class="form-label">Watermark</label>

            <div class="row g-3">
              <!-- IMAGE -->
              <div class="col-md-6">
                <div class="border rounded p-3 h-100">
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="wmType"
                      id="wmImageType"
                      value="image"
                      checked
                    />
                    <label class="form-check-label fw-semibold"> 🖼️ Ảnh </label>
                  </div>

                  <input
                    type="file"
                    class="form-control mb-2"
                    id="wmImage"
                    accept="image/*"
                  />

                  <div id="imageOptions">
                    <label class="form-label">
                      Kích thước ảnh: <span id="imgScaleValue">100</span>%
                    </label>
                    <input
                      type="range"
                      class="form-range"
                      id="imgScale"
                      min="10"
                      max="200"
                      value="100"
                    />
                  </div>
                </div>
              </div>

              <!-- TEXT -->
              <div class="col-md-6">
                <div class="border rounded p-3 h-100">
                  <div class="form-check mb-2">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="wmType"
                      id="wmTextType"
                      value="text"
                    />
                    <label class="form-check-label fw-semibold"> 🔤 Chữ </label>
                  </div>

                  <input
                    type="text"
                    class="form-control mb-2"
                    id="wmText"
                    placeholder="Nhập nội dung watermark"
                  />

                  <div id="textOptions">
                    <label class="form-label">
                      Cỡ chữ: <span id="fontSizeValue">40</span>px
                    </label>
                    <input
                      type="range"
                      class="form-range mb-2"
                      id="fontSize"
                      min="10"
                      max="100"
                      value="40"
                    />

                    <label class="form-label">Font chữ</label>
                    <select class="form-select mb-2" id="fontFamily">
                      <option value="Helvetica">Helvetica</option>
                      <option value="Times-Roman">Times New Roman</option>
                      <option value="Courier">Courier</option>
                    </select>

                    <div class="d-flex gap-3">
                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          id="fontBold"
                        />
                        <label class="form-check-label">Đậm</label>
                      </div>

                      <div class="form-check">
                        <input
                          class="form-check-input"
                          type="checkbox"
                          id="fontItalic"
                        />
                        <label class="form-check-label">Nghiêng</label>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- OPACITY -->
          <div class="mb-3">
            <label class="form-label">
              Độ trong suốt: <span id="opacityValue">30</span>%
            </label>
            <input
              type="range"
              class="form-range"
              id="wmOpacity"
              min="1"
              max="100"
              value="30"
            />
          </div>

          <!-- ACTION BUTTON -->
          <div class="action-box">
            <button id="mergeBtn" class="primary-btn" disabled>
              WATERMARK PDF
            </button>
          </div>
        </div>
      </div>
      <div class="container mt-3">
        <div class="text-center text-muted small">
          &copy; 2025 SE Project. NHA.
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const pdfInput = document.getElementById("pdfInput");
        const pdfPreview = document.getElementById("pdfPreview");
        const mergeBtn = document.getElementById("mergeBtn");

        const wmImageType = document.getElementById("wmImageType");
        const wmTextType = document.getElementById("wmTextType");
        const wmImage = document.getElementById("wmImage");
        const wmText = document.getElementById("wmText");

        const imageOptions = document.getElementById("imageOptions");
        const textOptions = document.getElementById("textOptions");

        const imgScale = document.getElementById("imgScale");
        const imgScaleValue = document.getElementById("imgScaleValue");

        const fontSize = document.getElementById("fontSize");
        const fontSizeValue = document.getElementById("fontSizeValue");

        const opacity = document.getElementById("wmOpacity");
        const opacityValue = document.getElementById("opacityValue");

        // ===== PREVIEW =====
        pdfInput.addEventListener("change", () => {
          if (!pdfInput.files.length) {
            mergeBtn.disabled = true;
            return;
          }
          mergeBtn.disabled = false;
          pdfPreview.src = URL.createObjectURL(pdfInput.files[0]);
        });

        // ===== WATERMARK TYPE =====
        function updateType() {
          const isText = wmTextType.checked;
          wmText.disabled = !isText;
          wmImage.disabled = isText;
          textOptions.style.display = isText ? "block" : "none";
          imageOptions.style.display = isText ? "none" : "block";
        }

        wmImageType.addEventListener("change", updateType);
        wmTextType.addEventListener("change", updateType);

        // ===== RANGE =====
        imgScale.oninput = () => (imgScaleValue.textContent = imgScale.value);
        fontSize.oninput = () => (fontSizeValue.textContent = fontSize.value);
        opacity.oninput = () => (opacityValue.textContent = opacity.value);

        updateType();

        // ===== SUBMIT =====
        mergeBtn.addEventListener("click", async () => {
          const formData = new FormData();
          formData.append("pdf", pdfInput.files[0]);
          formData.append("wmText", wmText.value);
          formData.append("fontSize", fontSize.value);
          formData.append("opacity", opacity.value);

          mergeBtn.disabled = true;
          mergeBtn.textContent = "ĐANG XỬ LÝ...";

          const res = await fetch("/watermark", {
            method: "POST",
            body: formData,
          });

          const blob = await res.blob();
          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = "watermarked.pdf";
          a.click();

          mergeBtn.textContent = "WATERMARK PDF";
          mergeBtn.disabled = false;
        });
      });
      formData.append("wmType", wmTextType.checked ? "text" : "image");

      if (!wmTextType.checked) {
        formData.append("wmImage", wmImage.files[0]);
        formData.append("imgScale", imgScale.value);
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
