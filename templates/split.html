<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Split PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f1f5f9;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont;
      }

      .split-container {
        max-width: 1000px; /* ✅ đủ rộng cho preview */
        width: 100%;
        margin: 60px auto;
        background: #fff;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      }

      .split-container h2 {
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
      }

      .upload-box {
        border: 2px dashed #c7d2fe;
        border-radius: 16px;
        padding: 40px 20px;
        text-align: center;
        cursor: pointer;
        color: #4f46e5;
        font-weight: 600;
        transition: 0.2s;
      }

      .upload-box:hover {
        background: #eef2ff;
      }

      #fileName {
        margin-top: 16px;
        font-weight: 500;
        color: #374151;
        text-align: center;
      }

      .range-box {
        margin-top: 24px;
      }

      .range-box label {
        font-weight: 600;
        margin-bottom: 8px;
      }

      #splitBtn {
        width: 100%;
        margin-top: 28px;
        padding: 14px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-weight: 700;
        font-size: 1.05rem;
        cursor: pointer;
      }

      #splitBtn:disabled {
        background: #c7d2fe;
        cursor: not-allowed;
      }
      /* ===== BRAND ===== */
      .navbar-brand {
        font-size: 1.3rem;
        letter-spacing: 0.6px;
      }

      /* ===== NAVBAR BASE ===== */
      .navbar {
        min-height: 70px;
      }

      .navbar-nav {
        gap: 6px; /* khoảng cách giữa menu */
      }

      /* ===== NAV LINK ===== */
      .navbar .nav-link {
        font-size: 1.05rem;
        padding: 10px 18px;
        border-radius: 12px;
        color: #374151;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .navbar .nav-link:hover {
        background: #f1f5f9;
        color: #2563eb;
      }

      /* ===== ACTIVE (CHỈ 1 MENU) ===== */
      .navbar .nav-link.active {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #fff !important;
        font-weight: 600;
      }

      /* ❗ dropdown toggle không full nền */
      .navbar .dropdown-toggle.active {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: #fff !important;
      }

      /* ===== DROPDOWN ===== */
      .dropdown-menu {
        border-radius: 14px;
        padding: 8px 0;
        min-width: 240px;
        border: none;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
      }

      .dropdown-item {
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 500;
      }

      .dropdown-item:hover {
        background: #eef2ff;
        color: #2563eb;
      }
      .range-row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      .range-row input {
        flex: 1;
      }

      .add-range {
        width: 36px;
        font-size: 20px;
        cursor: pointer;
      }
      /* ===== 2 COLUMNS ===== */
      .edit-area {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 24px;
      }

      /* ===== PREVIEW ===== */
      .preview-box {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        height: 520px;
        overflow: hidden;
        background: #f8fafc;
      }

      .preview-box iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* ===== OPTIONS ===== */
      .option-box {
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 20px;
        background: #f9fafb;
      }

      .option-box h5 {
        font-weight: 700;
        margin-bottom: 16px;
      }

      .form-label {
        font-weight: 600;
      }

      .btn-main {
        width: 100%;
        margin-top: 24px;
        padding: 14px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font-weight: 700;
        font-size: 1.05rem;
      }

      .btn-main:disabled {
        background: #c7d2fe;
      }
      .split-area {
        display: flex;
        gap: 24px;
        margin-top: 20px;
      }

      /* Cột preview (bên trái) */
      .preview-box {
        flex: 1;
        min-width: 0;
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
        background: #f8f9fa;
      }

      .preview-box iframe {
        width: 100%;
        height: 600px;
        border: none;
      }

      /* Cột tuỳ chọn (bên phải) */
      .option-box {
        flex: 1;
        min-width: 320px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
    </style>
  </head>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-danger fs-4" href="/">PDF TOOLS</a>

        <ul class="navbar-nav me-auto align-items-center fw-semibold">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('merge') }}">GHÉP PDF</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="{{ url_for('split') }}"
              >TÁCH PDF</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">CHUYỂN ĐỔI PDF</a>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              role="button"
              data-bs-toggle="dropdown"
            >
              CHỈNH SỬA PDF
            </a>

            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item" href="{{ url_for('rotate_pdf') }}">
                  🔄 Xoay trang
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('page_number') }}">
                  🔢 Thêm số trang
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('watermark') }}">
                  💧 Thêm hình mờ
                </a>
              </li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle"
              role="button"
              data-bs-toggle="dropdown"
            >
              TẤT CẢ CÁC CÔNG CỤ PDF
            </a>

            <ul class="dropdown-menu shadow">
              <li>
                <a class="dropdown-item" href="{{ url_for('merge') }}"
                  >GHÉP PDF</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('split') }}"
                  >TÁCH PDF</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="{{ url_for('index') }}"
                  >CHUYỂN ĐỔI PDF</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>
    <form action="/split" method="POST" enctype="multipart/form-data">
      <div class="split-container">
        <h2>TÁCH PDF</h2>

        <div class="split-area">
          <!-- ===== PREVIEW ===== -->
          <div class="preview-box">
            <iframe id="pdfPreview"></iframe>
          </div>

          <!-- ===== OPTIONS ===== -->
          <div class="option-box">
            <label class="upload-box">
              <input
                type="file"
                id="pdfInput"
                name="pdf_file"
                accept="application/pdf"
                hidden
              />
              📄 Kéo thả hoặc bấm để chọn 1 file PDF
            </label>

            <div id="fileName"></div>

            <!-- PAGE RANGE -->
            <div class="range-box">
              <h5>Trang cần tách (ví dụ: 1-3 hoặc 5)</h5>

              <div id="ranges">
                <div class="range-row">
                  <input
                    type="text"
                    name="page_range"
                    class="form-control"
                    placeholder="Ví dụ: 1-3"
                  />
                  <button type="button" class="add-range">+</button>
                </div>
              </div>
            </div>

            <div class="mode-box">
              <label>
                <input type="radio" name="split_mode" value="merge" checked />
                Gộp tất cả range thành 1 file
              </label>

              <label>
                <input type="radio" name="split_mode" value="separate" />
                Tách riêng từng range
              </label>
            </div>

            <button type="button" id="splitBtn" disabled>Tách PDF</button>
          </div>
        </div>
        <div class="container mt-3">
          <div class="text-center text-muted small">
            &copy; 2025 SE Project. NHA.
          </div>
        </div>
      </div>
    </form>

    <!-- ===== SCRIPT ===== -->
    <script>
      const input = document.getElementById("pdfInput");
      const fileName = document.getElementById("fileName");
      const btn = document.getElementById("splitBtn");
      const preview = document.getElementById("pdfPreview");
      let file = null;

      input.addEventListener("change", () => {
        file = input.files[0];
        if (file) {
          fileName.innerText = `📎 ${file.name}`;
          preview.src = URL.createObjectURL(file);
          btn.disabled = false;
        }
      });
    </script>

    <script>
      const rangesDiv = document.getElementById("ranges");

      rangesDiv.addEventListener("click", (e) => {
        if (e.target.classList.contains("add-range")) {
          const row = document.createElement("div");
          row.className = "range-row";

          row.innerHTML = `
        <input
          type="text"
          name="page_range"
          class="form-control"
          placeholder="Ví dụ: 4-6"
        />
        <button type="button" class="remove-range">−</button>
      `;

          rangesDiv.appendChild(row);
        }

        if (e.target.classList.contains("remove-range")) {
          e.target.parentElement.remove();
        }
      });
    </script>

    <script>
      btn.onclick = async () => {
        if (!file) return;

        const formData = new FormData();
        formData.append("pdf_file", file);

        // ===== SPLIT MODE =====
        const mode = document.querySelector(
          'input[name="split_mode"]:checked',
        ).value;
        formData.append("split_mode", mode);

        // ===== PAGE RANGES =====
        const ranges = document.querySelectorAll('input[name="page_range"]');
        let hasRange = false;

        const rangeRegex = /^\d+(-\d+)?$/;

        for (const input of ranges) {
          const value = input.value.trim();
          if (value !== "") {
            if (!rangeRegex.test(value)) {
              alert(`Khoảng trang không hợp lệ: ${value}`);
              return;
            }
            formData.append("page_range", value);
            hasRange = true;
          }
        }

        if (!hasRange) {
          alert("Vui lòng nhập ít nhất 1 khoảng trang");
          return;
        }

        btn.disabled = true;
        btn.innerText = "Đang tách...";

        try {
          const res = await fetch("/split", {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            const text = await res.text();
            alert(text);
            throw new Error("Split failed");
          }

          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = mode === "merge" ? "split.pdf" : "split.zip";
          document.body.appendChild(a);
          a.click();
          a.remove();

          window.URL.revokeObjectURL(url);
        } catch (err) {
          console.error(err);
        } finally {
          btn.disabled = false;
          btn.innerText = "Tách PDF";
        }
      };
    </script>
  </body>
</html>
