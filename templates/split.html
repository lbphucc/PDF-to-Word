{% extends "base.html" %}

{% set active_page = 'split' %}

{% block title %}Split PDF{% endblock %}

{% block content %}
<form action="/split" method="POST" enctype="multipart/form-data">
    <div class="split-container">
        <h2>TÁCH PDF</h2>

        <div class="split-area">
            <!-- ===== PREVIEW ===== -->
            <div class="preview-box">
                <iframe id="pdfPreview"></iframe>
            </div>

            <!-- ===== OPTIONS ===== -->
            <div class="option-box" id="optionBox">
                <label class="upload-box">
                    <input type="file" id="pdfInput" name="pdf_file" accept="application/pdf" hidden />
                    Kéo thả hoặc bấm để chọn 1 file PDF
                </label>

                <div id="fileName"></div>

                <!-- PAGE RANGE -->
                <div class="range-box">
                    <h5>Trang cần tách (ví dụ: 1-3 hoặc 5)</h5>

                    <div id="ranges">
                        <div class="range-row">
                            <input type="text" name="page_range" class="form-control" placeholder="Ví dụ: 1-3" />
                            <button type="button" class="add-range btn btn-outline-secondary">+</button>
                        </div>
                    </div>
                </div>

                <div class="mode-box mt-3">
                    <label class="d-block">
                        <input type="radio" name="split_mode" value="merge" checked />
                        Gộp tất cả range thành 1 file
                    </label>

                    <label class="d-block">
                        <input type="radio" name="split_mode" value="separate" />
                        Tách riêng từng range
                    </label>
                </div>

                <button type="button" id="splitBtn" class="btn-main" disabled>Tách PDF</button>
            </div>

            <!-- ===== RESULT BOX (ẩn mặc định) ===== -->
            <div class="option-box" id="resultBox" style="display: none;">
                <div class="alert alert-success">
                    <strong>Xử lý thành công!</strong><br>
                    Xem trước kết quả bên cạnh. Nếu hài lòng, nhấn "Tải về".
                </div>

                <div class="d-grid gap-2">
                    <button type="button" id="downloadBtn" class="btn btn-success btn-lg">
                        Tải về
                    </button>
                    <button type="button" id="cancelBtn" class="btn btn-outline-secondary">
                        Hủy & Làm lại
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}

{% block extra_js %}
<script>
    const input = document.getElementById("pdfInput");
    const fileName = document.getElementById("fileName");
    const btn = document.getElementById("splitBtn");
    const preview = document.getElementById("pdfPreview");
    const optionBox = document.getElementById("optionBox");
    const resultBox = document.getElementById("resultBox");
    const downloadBtn = document.getElementById("downloadBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let file = null;
    let currentResult = null;

    input.addEventListener("change", () => {
        file = input.files[0];
        if (file) {
            fileName.innerText = `${file.name}`;
            preview.src = URL.createObjectURL(file);
            btn.disabled = false;
        }
    });

    const rangesDiv = document.getElementById("ranges");

    rangesDiv.addEventListener("click", (e) => {
        if (e.target.classList.contains("add-range")) {
            const row = document.createElement("div");
            row.className = "range-row";

            row.innerHTML = `
                <input type="text" name="page_range" class="form-control" placeholder="Vi du: 4-6" />
                <button type="button" class="remove-range btn btn-outline-danger">−</button>
            `;

            rangesDiv.appendChild(row);
        }

        if (e.target.classList.contains("remove-range")) {
            e.target.parentElement.remove();
        }
    });

    btn.onclick = async () => {
        if (!file) return;

        const formData = new FormData();
        formData.append("pdf_file", file);

        // ===== SPLIT MODE =====
        const mode = document.querySelector('input[name="split_mode"]:checked').value;
        formData.append("split_mode", mode);

        // ===== PAGE RANGES =====
        const ranges = document.querySelectorAll('input[name="page_range"]');
        let hasRange = false;

        const rangeRegex = /^\d+(-\d+)?$/;

        for (const input of ranges) {
            const value = input.value.trim();
            if (value !== "") {
                if (!rangeRegex.test(value)) {
                    alert(`Khoảng trang không hợp lệ: ${value}`);
                    return;
                }
                formData.append("page_range", value);
                hasRange = true;
            }
        }

        if (!hasRange) {
            alert("Vui lòng nhập ít nhất 1 khoảng trang");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Đang tách...";

        try {
            const res = await fetch("/split", {
                method: "POST",
                body: formData,
            });

            const data = await res.json();

            if (!res.ok || data.error) {
                alert(data.error || "Có lỗi xảy ra");
                throw new Error("Split failed");
            }

            // Lưu kết quả và hiển thị preview
            currentResult = data;
            preview.src = data.preview_url;

            // Ẩn option box, hiện result box
            optionBox.style.display = "none";
            resultBox.style.display = "block";

        } catch (err) {
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = "Tách PDF";
        }
    };

    // Nút tải về
    downloadBtn.onclick = () => {
        if (currentResult) {
            window.location.href = currentResult.download_url;
        }
    };

    // Nút hủy
    cancelBtn.onclick = async () => {
        if (currentResult) {
            // Xóa file trên server
            await fetch(`/cancel-result/${currentResult.filename}`);
            if (currentResult.preview_filename) {
                await fetch(`/cancel-result/${currentResult.preview_filename}`);
            }
        }

        // Reset UI
        currentResult = null;
        optionBox.style.display = "block";
        resultBox.style.display = "none";
        preview.src = file ? URL.createObjectURL(file) : "";
    };
</script>
{% endblock %}
