<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF Converter{% endblock %} | SE Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header -->
    <div class="container-fluid mb-4">
        <div class="text-center">
            <h2 class="text-primary fw-bold">PDF Converter</h2>
            <p class="text-muted">Công cụ hỗ trợ chuyển đổi tài liệu PDF sang Word, Excel, PowerPoint</p>
        </div>
    </div>

    {% block content %}{% endblock %}

    <!-- Footer -->
    <div class="container-fluid mt-4">
        <div class="text-center text-muted small">
            &copy; 2025 SE Project. LBP.
        </div>
    </div>

    <!-- Modal xác nhận xóa tất cả -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Bạn có chắc chắn muốn xóa <strong>tất cả</strong> lịch sử chuyển đổi không?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <a href="{{ url_for('delete_all_history') }}" class="btn btn-danger">Xóa tất cả</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
